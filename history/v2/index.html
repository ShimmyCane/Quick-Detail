<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wall Sketch</title>
  <link rel="stylesheet" href="sketch/style.css">
</head>
<body>

  <!-- The sheet. Nothing else is drawn on it: no toolbar, no palette. -->
  <canvas id="sheet" aria-label="Drawing sheet"></canvas>

  <!-- Shown only while recording. Not a control. -->
  <div id="recDot" class="rec-dot" hidden><span></span><time id="recTime">00:00</time></div>

  <!-- The only permanent mark on the page. Opens settings. -->
  <button id="gear" class="gear" aria-label="Settings" title="Settings">⚙</button>

  <nav id="drawer" class="drawer" hidden aria-label="Settings">
    <div class="drawer-head">
      <h2>Settings</h2>
      <button class="link" id="closeDrawer">Close</button>
    </div>

    <section>
      <h3>Recording</h3>
      <button class="btn" id="recBtn">Record</button>
      <p class="muted">Drawing, sound and speech are saved together. A pause of 3 seconds starts a new moment.</p>
    </section>

    <section>
      <h3>Sheet</h3>
      <div class="row">
        <button class="btn" id="undoBtn">Undo</button>
        <button class="btn" id="clearBtn">Clear sheet</button>
      </div>
    </section>

    <section>
      <h3>Recordings</h3>
      <ul id="sessionList" class="sessions"></ul>
    </section>

    <section>
      <h3>Earlier version</h3>
      <a href="history/v1/index.html">Open the previous Quick Detail</a>
    </section>

    <p class="muted small">Keys: R record · Space play or pause · Esc close · Ctrl+Z undo</p>
  </nav>

  <!-- Playback. Opened from a recording in Settings. -->
  <section id="player" class="player" hidden aria-label="Playback">
    <div class="player-bar">
      <button class="btn" id="playBtn" aria-label="Play">▶</button>
      <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Position">
      <span id="clock" class="clock">00:00</span>
      <button class="link" id="exitBtn">Done</button>
    </div>
    <ol id="moments" class="moments"></ol>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script src="sketch/core.js"></script>
  <script src="sketch/app.js"></script>
</body>
</html>
